name: Cleanup GHCR Images

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  cleanup:
    concurrency:
      group: cleanup-ghcr-images
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: delete temp temp at 7 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f #v1.2.2
        with:
          packages: > 
            temp/temp/components/dpm
          dry-run: false
          older-than: 7 days
          delete-tags: '*'
          delete-untagged: true
          delete-partial-images: true
          validate: true

      - name: delete temp at 60 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f #v1.2.2
        with:
          packages: >
             temp/components/dpm
          dry-run: false
          older-than: 60 days
          delete-tags: '*'
          delete-untagged: true
          delete-partial-images: true
          validate: true
