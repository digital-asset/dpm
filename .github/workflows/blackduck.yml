name: blackduck
defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && source .envrc.vars && exec bash {0}"
on:
  push:
    paths:
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  USER: gha
  BLACKDUCK_HUBDETECT_TOKEN: ${{ secrets.DA_BLACKDUCK }}

jobs:
  scan:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: digital-asset-dpm
    permissions:
      contents: write
      pull-requests: write  
      id-token: write  
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_REBASE_PAT }}
      - uses: ./.github/actions/nix

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/794775982379/locations/global/workloadIdentityPools/github-actions/providers/da-provider
          service_account: gh-da-dpm@da-images.iam.gserviceaccount.com
      
      - name: Login to GAR
        uses: docker/login-action@v4
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        
      - name: Build and Test Go Project
        run: |
          go build -o target/ ./cmd/...
          go test -v ./...
        shell: bash -euo pipefail -c "source nix.source && exec bash {0}"
      - uses: ./.github/actions/blackduck-scan
      - name: Rename notices file
        run: |
          files=( *Black_Duck_Notices_Report.txt )
          if [ "${#files[@]}" -eq 1 ]; then
            mv -- "${files[0]}" NOTICES
          else
            echo "Expected exactly one *Black_Duck_Notices_Report.txt file, found ${#files[@]}" >&2
            exit 1
          fi
        shell: bash -euo pipefail -c "source nix.source && exec bash {0}"
      - name: Commit and push changes
        if: github.ref_type == 'branch'
            && github.ref != 'refs/heads/main'
            && ! startsWith(github.ref, 'refs/heads/release-line')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NOTICES
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NOTICES after go.mod change"
            git push
          fi
        shell: bash -euo pipefail -c "source nix.source && exec bash {0}"
