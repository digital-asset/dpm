name: build
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:


env:

  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
  IS_TRUSTED_PR: >-
    ${{ 
      github.event_name != 'pull_request' || 
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name 
    }}


defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash {0}"

jobs:
  linux:
    # Never execute fork PR code on the self-hosted runner.
    # Trusted pushes to the canonical repository may use the self-hosted runner.
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
        'ubuntu-latest' ||
        'digital-asset-dpm'
      }}
    

    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: ./.github/actions/nix

      - name: Run go build
        run: go build -o target/ ./cmd/...

      - name: Run Go tests and generate in json format
        run: go test -json -v ./... | tee report.json; exit "${PIPESTATUS[0]}"

      - name: Publish Test Report
        if: env.IS_FORK_PR == 'false'
        uses: dorny/test-reporter@fe45e9537387dac839af0d33ba56eed8e24189e8
        with:
          name: Go Tests
          path: report.json
          reporter: golang-json
          fail-on-error: 'true'
          fail-on-empty: 'true'
          report-title: 'Go Tests'

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      - name: Check
        run: |
            go mod tidy
            git diff --exit-code --color go.mod go.sum || {
              echo "::error::Please run 'go mod tidy'"
              exit 1
            }
        shell: bash
      - run: go build -o target/ ./cmd/...
        shell: bash
      - name: Run Go tests and generate in json format
        run: go test -json -v ./... | tee report.json; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Publish Test Report
        if: env.IS_FORK_PR == 'true'
        uses: dorny/test-reporter@fe45e9537387dac839af0d33ba56eed8e24189e8
        with:
          name: Go Tests
          path: report.json
          reporter: golang-json

  release-public:
    runs-on: 'digital-asset-dpm'
    needs: 
      - windows
      - linux
    if: >
      github.repository == 'digital-asset/dpm' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.ref != 'refs/tags/0.0.0-skiprelease'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release
        with:
          repo: "temp"
          flags: "--clean --skip=announce,publish,validate"
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  release-public-unstable:
    runs-on: 'digital-asset-dpm'
    needs:
      - windows
      - linux
    # Restrict unstable releases to push events only (never run on PRs)
    if: >
      github.repository == 'digital-asset/dpm' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'digital-asset/dpm'
        )
      )
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: ./.github/actions/release
        with:
          # todo - update once decided moved to CF
          repo: "temp/temp"
          flags: "--snapshot"
          gh_token: ${{ secrets.GITHUB_TOKEN }}