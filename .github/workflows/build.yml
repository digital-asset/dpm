name: build

on:
  - push

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && export PATH=$GITHUB_WORKSPACE/bin:$PATH && exec bash {0}"

jobs:

  test-mirror:
    runs-on: digital-asset-dpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/nix

      - name: test-mirror
        env:
          SBT_MAVEN_MIRROR: "http://reposilite.reposilite:8080/maven-central-proxy"
        run: |
          set -xeuo pipefail
          
          echo "SBT_OPTS=$SBT_OPTS"
          
          mkdir -p /tmp/sbt-mirror-test/project
          cd /tmp/sbt-mirror-test
          
          cat > build.sbt <<'EOF'
          scalaVersion := "2.13.14"
          libraryDependencies ++= Seq(
            "org.typelevel" %% "cats-core" % "2.12.0",
            "io.circe" %% "circe-core" % "0.14.9",
            "org.apache.commons" % "commons-lang3" % "3.14.0"
          )
          
          EOF
          
          cat > project/build.properties <<'EOF'
          sbt.version=1.10.7
          EOF
          
          echo "repositories:"
          cat "$HOME/.sbt/repositories"
          
          sbt -debug update
